services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: episcope-qdrant
    ports:
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:6333:6333"
      - "${QDRANT_BIND_ADDRESS:-127.0.0.1}:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: episcope-api
    env_file:
      - .env
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      EPISCOPE_API_HOST: 0.0.0.0
      EPISCOPE_API_PORT: 8000
    ports:
      - "${EPISCOPE_API_BIND_ADDRESS:-127.0.0.1}:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: episcope-ui
    env_file:
      - .env
    depends_on:
      api:
        condition: service_healthy
    environment:
      EPISCOPE_API_BASE_URL: http://api:8000
    ports:
      - "${EPISCOPE_UI_BIND_ADDRESS:-127.0.0.1}:8501:8501"
    restart: unless-stopped

  proxy:
    image: caddy:2
    container_name: episcope-proxy
    depends_on:
      - api
      - ui
    ports:
      - "${EPISCOPE_PROXY_BIND_ADDRESS:-127.0.0.1}:${EPISCOPE_PROXY_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    profiles:
      - deploy
      - tunnel

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: episcope-cloudflared
    depends_on:
      - proxy
    command: tunnel --no-autoupdate --url http://proxy:8080
    restart: unless-stopped
    profiles:
      - tunnel

volumes:
  qdrant_data:
  caddy_data:
  caddy_config:
