version: '3'

services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build: .
    depends_on:
      - qdrant
    environment:
      EPISCOPE_INDEX_URL: http://qdrant:6333
    ports:
      - "8000:8000"

  # grobid service can be added later
  # grobid:
  #   image: lfoppiano/grobid:0.7.3
  #   ports:
  #     - "8070:8070"
  #   environment:
  #     GROBID_HOME: /opt/grobid

volumes:
  qdrant_data:
