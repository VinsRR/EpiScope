services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: episcope-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: episcope-api
    env_file:
      - .env
    depends_on:
      - qdrant
    environment:
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-episcope_academic}
      MONGO_URI: ${mongo_uri:-}
      MONGO_DB_NAME: ${MONGO_DB_NAME:-episcope_academic_db}
      EPISCOPE_LLM_PROVIDER: ${EPISCOPE_LLM_PROVIDER:-gemini}
      EPISCOPE_LLM_MODEL: ${EPISCOPE_LLM_MODEL:-gemini-2.5-flash}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://host.docker.internal:11434}
      CROSS_ENCODER_MODEL: ${CROSS_ENCODER_MODEL:-cross-encoder/ms-marco-MiniLM-L-6-v2}
    ports:
      - "8000:8000"
    restart: unless-stopped

  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: episcope-ui
    env_file:
      - .env
    depends_on:
      - api
    environment:
      EPISCOPE_API_BASE_URL: http://api:8000
    ports:
      - "8501:8501"
    restart: unless-stopped

volumes:
  qdrant_data:
