name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: macos-latest
            python-version: "3.10"
          - os: macos-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.10"
          - os: windows-latest
            python-version: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and test tools
        run: python -m pip install ".[dev]"
      - name: Run tests
        run: python -m pytest -q

  optional-features:
    name: Optional API, UI, stores, and provider
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tested extras
        run: >-
          python -m pip install
          ".[dev,server,ui,qdrant,mongo,faiss,gemini]"
      - name: Run full suite with optional dependencies
        run: python -m pytest -q

  quality:
    name: Lint and package artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install ".[dev]"
      - name: Lint
        run: ruff check src/epilens tests
      - name: Build wheel and source distribution
        run: python -m build
      - name: Check artifact metadata
        run: python -m twine check dist/*
      - name: Verify the wheel outside the source tree
        shell: bash
        run: |
          wheel="$(python -c 'import glob; print(glob.glob("dist/*.whl")[0])')"
          wheel="$(cd "$(dirname "$wheel")" && pwd)/$(basename "$wheel")"
          python -m venv /tmp/epilens-wheel-smoke
          /tmp/epilens-wheel-smoke/bin/python -m pip install "$wheel"
          cd /tmp
          /tmp/epilens-wheel-smoke/bin/python -c "import epilens; print(epilens.__version__)"
          /tmp/epilens-wheel-smoke/bin/epilens --help
          /tmp/epilens-wheel-smoke/bin/python -m epilens --version
