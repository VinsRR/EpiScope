[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epi-scope"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "typer",
    "requests",
    "numpy",
    "python-dotenv",
    "fastembed",
    "tqdm",
    "unstructured",
    "pdfminer.six",
    "openai",
    "google-genai",
    "anthropic",
    "rapidfuzz",
    "lxml",
    "filelock",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.36",
    "pandas",
    "requests",
    "python-dotenv",
]
server = [
    "fastapi",
    "uvicorn",
    "python-multipart",
    "qdrant-client",
    "pymongo",
]
# GROBID-backed PDF parsing (`--loader grobid`). Provides the `grobid_client`
# module used by episcope.rag.ingestion.local_grobid_client.
grobid = [
    "grobid-client-python",
]
# Local FAISS vector backend (`--index-backend faiss`).
faiss = [
    "faiss-cpu",
]
# The heavier local ML stack: torch-based embedding models beyond the
# lightweight fastembed default (provider="huggingface"), and unstructured's
# hi_res PDF parsing (layout/table models via unstructured-inference). Only
# needed for custom embedding models or best-effort PDF structure extraction;
# the lightweight defaults (fastembed + the pdfminer heuristic loader) work
# without it.
local-ml = [
    "torch",
    "transformers",
    "sentence-transformers",
    "unstructured[pdf]",
]
# Everything needed to run the API and the Streamlit UI together.
all = [
    "epi-scope[server]",
    "epi-scope[ui]",
]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.11",
    "ty==0.0.35",
    "tox==4.54.0",
    "build",
    "twine",
]

[project.scripts]
episcope = "episcope.episcope:main"
episcope-ui = "episcope.ui.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
episcope = ["py.typed"]
