[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epi-scope"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic",
    "typer",
    "requests",
    "numpy",
    "python-dotenv",
    "torch",
    "transformers",
    "sentence-transformers",
    "tqdm",
    "unstructured[pdf]",
    "pypdf",
    "openai",
    "google-genai",
    "rapidfuzz",
    "lxml",
]

[project.optional-dependencies]
ui = [
    "streamlit",
    "pandas",
    "requests",
    "python-dotenv",
]
server = [
    "fastapi",
    "uvicorn",
    "qdrant-client",
    "pymongo",
]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.11",
    "ty==0.0.35",
    "tox==4.54.0",
    "build",
    "twine",
]

[project.scripts]
episcope = "episcope.episcope:main"
episcope-ui = "episcope.ui.launcher:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
episcope = ["py.typed"]
