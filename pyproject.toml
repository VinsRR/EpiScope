[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "episcope"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "typer",
    "requests",
    "numpy",
    "python-dotenv",
    "torch",
    "transformers",
    "sentence-transformers",
    "tqdm",
    "faiss-cpu",
    "qdrant-client",
    "unstructured[pdf]",
    "pypdf",
    "openai",
    "google-genai",
    "rapidfuzz",
    "lxml",
    "pymongo",
]

[project.optional-dependencies]
ui = [
    "streamlit",
]
eval = [
    "pandas",
    "scikit-learn",
    "ragas",
    "langchain-core",
    "httpx",
]
topic-baselines = [
    "bertopic",
    "top2vec",
]
table-extraction = [
    "gmft",
    "pymupdf",
    "layoutparser",
    "img2table",
    "effdet",
]
dev = [
    "pytest==9.0.3",
    "ruff==0.15.11",
    "ty==0.0.35",
    "tox==4.54.0",
    "ragas==0.4.3",
]
all = [
    "streamlit",
    "pandas",
    "scikit-learn",
    "ragas",
    "langchain-core",
    "httpx",
    "bertopic",
    "top2vec",
    "gmft",
    "pymupdf",
    "layoutparser",
    "img2table",
    "effdet",
    "pytest==9.0.3",
    "ruff==0.15.11",
    "ty==0.0.35",
    "tox==4.54.0",
    "ragas==0.4.3",
]

[project.scripts]
episcope = "episcope.episcope:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
episcope = ["py.typed"]
